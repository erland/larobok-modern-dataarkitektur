<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img"><rect width="1200" height="800" fill="white"/><g font-family="Noto Sans, DejaVu Sans, sans-serif">
<text x="600" y="65" font-size="24" font-weight="600" fill="#334155" text-anchor="middle">FEM SAMVERKANDE ARKITEKTURDIMENSIONER</text>
<rect x="40" y="115" width="350" height="220" rx="8" fill="#ECFEFF" stroke="#0E7490" stroke-width="2"/>
<text x="215.0" y="188.0" font-size="26" font-weight="600" fill="#0E7490" text-anchor="middle">Informations-</text>
<text x="215.0" y="218.0" font-size="26" font-weight="600" fill="#0E7490" text-anchor="middle">försörjning</text>
<text x="215.0" y="248.0" font-size="22" font-weight="400" fill="#334155" text-anchor="middle">Vad överförs?</text>
<text x="215.0" y="278.0" font-size="22" font-weight="400" fill="#334155" text-anchor="middle">När och hur?</text>
<rect x="425" y="115" width="350" height="220" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
<text x="600.0" y="188.0" font-size="26" font-weight="600" fill="#2563EB" text-anchor="middle">Lagring och</text>
<text x="600.0" y="218.0" font-size="26" font-weight="600" fill="#2563EB" text-anchor="middle">bearbetning</text>
<text x="600.0" y="248.0" font-size="22" font-weight="400" fill="#334155" text-anchor="middle">Var och i vilken form?</text>
<text x="600.0" y="278.0" font-size="22" font-weight="400" fill="#334155" text-anchor="middle">Med vilka motorer?</text>
<rect x="810" y="115" width="350" height="220" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
<text x="985.0" y="188.0" font-size="26" font-weight="600" fill="#7C3AED" text-anchor="middle">Tillgängliggörande</text>
<text x="985.0" y="218.0" font-size="26" font-weight="600" fill="#7C3AED" text-anchor="middle">och konsumtion</text>
<text x="985.0" y="248.0" font-size="22" font-weight="400" fill="#334155" text-anchor="middle">Hur hittas och</text>
<text x="985.0" y="278.0" font-size="22" font-weight="400" fill="#334155" text-anchor="middle">används information?</text>
<rect x="40" y="385" width="1120" height="145" rx="8" fill="#F0FDFA" stroke="#0F766E" stroke-width="2"/>
<text x="600.0" y="450.5" font-size="26" font-weight="600" fill="#0F766E" text-anchor="middle">Gemensamma plattformsförmågor</text>
<text x="600.0" y="480.5" font-size="22" font-weight="400" fill="#334155" text-anchor="middle">Återanvändbara tekniska tjänster och självbetjäning</text>
<rect x="40" y="580" width="1120" height="145" rx="8" fill="#FFFBEB" stroke="#B45309" stroke-width="2"/>
<text x="600.0" y="645.5" font-size="26" font-weight="600" fill="#B45309" text-anchor="middle">Organisation och ansvar</text>
<text x="600.0" y="675.5" font-size="22" font-weight="400" fill="#334155" text-anchor="middle">Beslutanderätt, informationsansvar, regler och teknisk drift</text>
</g></svg>